# tools/docker/compose.dev.yml
name: tesis-container

services:
  frontend:
    container_name: tesis-container-frontend
    build:
      context: ../..
      dockerfile: tools/docker/frontend.Dockerfile
    volumes:
      - ../../apps/frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_ALLOW_REAL_APPLY=1 # ✅ Permite apply real en local (si el backend también lo permite)
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - appnet

  backend:
    user: app
    container_name: tesis-container-backend
    build:
      context: ../..
      dockerfile: tools/docker/backend.Dockerfile
    volumes:
      - ../../apps/backend:/app
      - tfstate:/tfstate
      - tfwork:/tfwork
      - ${HOME}/.aws:/home/app/.aws:ro
    env_file:
      - ../../.env
      - ../../.env.dev
    environment:
      - HOME=/home/app
      - DJANGO_SETTINGS_MODULE=teg.settings
      - DEBUG=true
      # 👉 fuerza Postgres local (host = nombre del servicio "postgres")
      - DATABASE_URL=postgres://teg:teg@postgres:5432/teg
      - DB_SSL_REQUIRE=false
      # ✅ DEV seguro: usa AWS profile montado (no keys en .env.dev)
      - AWS_SDK_LOAD_CONFIG=1
      - AWS_PROFILE=tesis
      - AWS_DEFAULT_REGION=us-east-1
      # ✅ Habilita apply/destroy real en local (tasks.py lo exige)
      - ALLOW_LOCAL_APPLY=1
    ports:
      - "8000:8000"
    depends_on:
      # 👉 espera a que Postgres esté healthy antes de arrancar
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - appnet
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/healthz/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  celery:
    user: app
    container_name: tesis-container-celery
    build:
      context: ../..
      dockerfile: tools/docker/celery.Dockerfile
    command: bash -lc "celery -A teg worker -E --loglevel=INFO --pool=solo"
    volumes:
      - ../../apps/backend:/app
      - tfstate:/tfstate
      - tfwork:/tfwork
      - ${HOME}/.aws:/home/app/.aws:ro
    env_file:
      - ../../.env
      - ../../.env.dev
    environment:
      - HOME=/home/app
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DATABASE_URL=postgres://teg:teg@postgres:5432/teg
      - DB_SSL_REQUIRE=false
      - AWS_SDK_LOAD_CONFIG=1
      - AWS_PROFILE=tesis
      - AWS_DEFAULT_REGION=us-east-1
      - ALLOW_LOCAL_APPLY=1
      - KEEP_TF_DIRS=1 # Evita que celery borre los directorios temporales de terraform
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - appnet
    healthcheck:
      test: ["CMD-SHELL", "celery -A teg inspect ping | grep -q 'pong'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  flower:
    container_name: tesis-container-flower
    build:
      context: ../..
      dockerfile: tools/docker/flower.Dockerfile
    command:
      ["celery", "--broker=redis://redis:6379/0", "flower", "--port=5555"]
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy
      celery:
        condition: service_healthy
    networks:
      - appnet

  # --- Postgres local (siempre encendido en dev) ---
  postgres:
    image: postgres:15
    container_name: tesis-postgres
    environment:
      POSTGRES_DB: teg
      POSTGRES_USER: teg
      POSTGRES_PASSWORD: teg
    ports:
      - "5432:5432" # puedes quitar este mapeo si no te conectas desde fuera
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teg -d teg"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - appnet

  redis:
    container_name: tesis-container-redis
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 15
    networks:
      - appnet

volumes:
  frontend_node_modules:
  pgdata:
  tfstate:
  tfwork:

networks:
  appnet:
    driver: bridge
