name: tesis-container

services:
  frontend:
    container_name: tesis-container-frontend
    build:
      context: ../..
      dockerfile: tools/docker/frontend.Dockerfile
    volumes:
      - ../../apps/frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - appnet

  backend:
    container_name: tesis-container-backend
    build:
      context: ../..
      dockerfile: tools/docker/backend.Dockerfile
    volumes:
      - ../../apps/backend:/app
    env_file:
      - ../../.env
    environment:
      - DJANGO_SETTINGS_MODULE=teg.settings
      # 👉 fuerza Postgres local (host = nombre del servicio "postgres")
      - DATABASE_URL=postgres://teg:teg@postgres:5432/teg
      - DB_SSL_REQUIRE=false
      # (opcional) para S3 si lo usas en local
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=us-east-1
    ports:
      - "8000:8000"
    depends_on:
      # 👉 espera a que Postgres esté healthy antes de arrancar
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - appnet
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  celery:
    container_name: tesis-container-celery
    build:
      context: ../..
      dockerfile: tools/docker/backend.Dockerfile
    command: bash -lc "celery -A teg worker -E --loglevel=INFO --pool=solo"
    volumes:
      - ../../apps/backend:/app
    env_file:
      - ../../.env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      # 👉 igual que backend
      - DATABASE_URL=postgres://teg:teg@postgres:5432/teg
      - DB_SSL_REQUIRE=false
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=us-east-1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - appnet
    healthcheck:
      test: ["CMD-SHELL", "celery -A teg inspect ping | grep -q 'pong'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  flower:
    container_name: tesis-container-flower
    build:
      context: ../..
      dockerfile: tools/docker/flower.Dockerfile
    command:
      ["celery", "--broker=redis://redis:6379/0", "flower", "--port=5555"]
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy
      celery:
        condition: service_healthy
    networks:
      - appnet

  # --- Postgres local (siempre encendido en dev) ---
  postgres:
    image: postgres:15
    container_name: tesis-postgres
    environment:
      POSTGRES_DB: teg
      POSTGRES_USER: teg
      POSTGRES_PASSWORD: teg
    ports:
      - "5432:5432" # puedes quitar este mapeo si no te conectas desde fuera
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teg -d teg"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - appnet

  redis:
    container_name: tesis-container-redis
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 15
    networks:
      - appnet

volumes:
  frontend_node_modules:
  pgdata:

networks:
  appnet:
    driver: bridge
