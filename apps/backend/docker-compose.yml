services:
  web:
    build: .
    container_name: tesis-backend
    entrypoint: ./entrypoint.sh
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - PORT=8000
    env_file:
      - .env
    depends_on:
      - redis

  redis:
    image: redis:7.2-alpine
    container_name: tesis-redis
    ports:
      - "6379:6379"

  celery:
    build: .
    container_name: tesis-celery
    entrypoint: ./entrypoint.sh
    command: celery -A teg worker -l info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - redis
      - web


  flower:
    image: mher/flower
    container_name: tesis-flower
    ports:
      - "5555:5555"
    command:
      [
        "celery",
        "--broker=redis://redis:6379/0",
        "flower",
        "--port=5555"
      ]
    depends_on:
      - redis

