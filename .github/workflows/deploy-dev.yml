name: Deploy (dev)

on:
  push:
    branches:
      - feature/aws-docker-infra
  workflow_dispatch:
    inputs:
      backend_desired:
        description: "Réplicas backend"
        required: true
        default: "1"
      celery_desired:
        description: "Réplicas celery"
        required: true
        default: "1"
      tag:
        description: "Tag extra de imagen (además de dev-latest)"
        required: true
        default: "sha-${{ github.sha }}"

permissions:
  id-token: write # OIDC
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ECR_BACKEND_REPO: tesis-dev-backend
  ECR_CELERY_REPO: tesis-dev-celery
  FIXED_TAG: dev-latest
  BACKEND_DESIRED: ${{ github.event.inputs.backend_desired || '1' }}
  CELERY_DESIRED: ${{ github.event.inputs.celery_desired  || '1' }}

jobs:
  sanity-check:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: 🔐 Configure AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME || secrets.AWS_ROLE_TO_ASSUME }}

      - name: 🕵️ Who am I?
        run: aws sts get-caller-identity

      - name: 🔎 ECR can describe?
        run: aws ecr describe-repositories --repository-names tesis-dev-backend

      - name: 🔎 ECS can describe service?
        run: aws ecs describe-services --cluster tesis-dev-cluster --services tesis-dev-svc-backend

      - name: 🔎 Terraform init (sin backend)
        working-directory: infra/terraform
        run: terraform init -backend=false -input=false

  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: 🔐 Configure AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          # Puedes usar repo/organization "Variables" o un Secret.
          # Si usas Variable de repo/org, accede con vars.AWS_ROLE_TO_ASSUME
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME || secrets.AWS_ROLE_TO_ASSUME }}

      - name: 🔑 Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 🧱 Build & Push backend
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          EXTRA_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -e
          ECR="$REGISTRY/${{ env.ECR_BACKEND_REPO }}"
          DOCKERFILE="tools/docker/backend.Dockerfile"
          docker build -f "$DOCKERFILE" -t tesis-container-backend:latest .
          # Tags
          docker tag tesis-container-backend:latest "$ECR:${{ env.FIXED_TAG }}"
          [ -z "$EXTRA_TAG" ] && EXTRA_TAG="sha-${GITHUB_SHA}"
          docker tag tesis-container-backend:latest "$ECR:$EXTRA_TAG"
          # Push
          docker push "$ECR:${{ env.FIXED_TAG }}"
          docker push "$ECR:$EXTRA_TAG"

      - name: 🧱 Build & Push celery
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          EXTRA_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -e
          ECR="$REGISTRY/${{ env.ECR_CELERY_REPO }}"
          DOCKERFILE="tools/docker/celery.Dockerfile"
          [ -f "$DOCKERFILE" ] || DOCKERFILE="tools/docker/backend.Dockerfile"
          docker build -f "$DOCKERFILE" -t tesis-container-celery:latest .
          # Tags
          docker tag tesis-container-celery:latest "$ECR:${{ env.FIXED_TAG }}"
          [ -z "$EXTRA_TAG" ] && EXTRA_TAG="sha-${GITHUB_SHA}"
          docker tag tesis-container-celery:latest "$ECR:$EXTRA_TAG"
          # Push
          docker push "$ECR:${{ env.FIXED_TAG }}"
          docker push "$ECR:$EXTRA_TAG"

      - name: ⚙️ Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5

      - name: 🛠️ Terraform Init
        working-directory: infra/terraform
        run: terraform init -input=false -upgrade

      - name: 🚀 Terraform Apply (ECS/ALB/RDS)
        working-directory: infra/terraform
        env:
          TF_VAR_backend_desired_count: ${{ env.BACKEND_DESIRED }}
          TF_VAR_celery_desired_count: ${{ env.CELERY_DESIRED }}
        run: terraform apply -auto-approve

      - name: 🔎 Esperar ECS estable
        env:
          CLUSTER: tesis-dev-cluster
          SVC_BACKEND: tesis-dev-svc-backend
          SVC_CELERY: tesis-dev-svc-celery
        run: |
          set -e
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$SVC_BACKEND"
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$SVC_CELERY"

      - name: 🩺 Esperar ALB 200/JSON /healthz
        working-directory: infra/terraform
        run: |
          set -e
          URL=$(terraform output -raw backend_url)
          echo "⏳ Polling $URL/healthz/ …"
          end=$((60))
          while :; do
            R=$(curl -fsS -m 5 -w ' HTTP_CODE:%{http_code}' "$URL/healthz/" || true)
            CODE=${R##*HTTP_CODE:}; BODY=${R% HTTP_CODE:*}
            if [ "$CODE" = "200" ] && echo "$BODY" | jq -e '.status=="ok"' >/dev/null 2>&1; then
              echo "✅ ALB OK"; echo "$BODY" | jq .; break
            fi
            [ $end -le 0 ] && { echo "❌ Timeout ALB. Última resp:"; echo "$BODY"; exit 1; }
            sleep 5; end=$((end-5))
          done

      - name: 🗃️ Migraciones Django (ECS Exec)
        run: make aws-migrate

      - name: 💨 Smoke tests (healthz + celery + network_plan)
        run: make smoke
