name: Stop DEV

on:
  workflow_dispatch: # se lanza manualmente desde Actions

permissions:
  id-token: write
  contents: read

jobs:
  stop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::034739223309:role/tesis-dev-github-deploy
      - run: terraform -chdir=infra/terraform apply -auto-approve \
          -var="backend_desired_count=0" -var="celery_desired_count=0"
