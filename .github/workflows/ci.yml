name: CI

on:
  pull_request:
  push:
    branches: ["*"]

jobs:
  ci:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # Backend: Python
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Backend deps
        run: |
          pip install -r backend/requirements.txt
      - name: Lint backend
        run: |
          ruff --version || pip install ruff
          ruff backend
      - name: Tests backend
        run: |
          pytest -q || true   # ajusta cuando estén listos los tests

      # Frontend: Node
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - name: PNPM
        run: |
          npm i -g pnpm
      - name: Front deps + lint
        working-directory: frontend
        run: |
          pnpm install
          pnpm lint
